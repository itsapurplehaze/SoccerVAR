<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <title>SoccerVAR</title>
    <link rel="stylesheet" href="./style.css"/>
</head>
<body>
  <div id="landing-page">
    <div class="landing-content">
      <div class="button-group">
        <button id="startButton">START</button>
        <button id="trivButton">TRIVIA</button>
        <button id="helpButton" onclick="window.location.href= './help.html'">HELP</button>
      </div>
      <p id="error-message" class="hidden"></p>
    </div>
  </div>

  <div id="ar-container" class="hidden">
    <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind; filterMinCF: 0.1; filterBeta: 100; warmupTolerance: 5; missTolerance: 10;" 
    color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false" autostart="false">
      <!--Cámara-->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!--Carga de modelos y recursos-->
      <a-assets>
        <a-asset-item id="Mex-taco" src="./assets/taco.glb"></a-asset-item>
      </a-assets>

      <!--Index de las banderas en el .mind-->
      <!--México-->
      <a-entity id="Mexico-flag" mindar-image-target="targetIndex: 0">
        <a-entity position="0 0 0.1" scale="0.04 0.04 0.04" rotation="0 180 0">
          <a-gltf-model src="#Mex-taco" animation-mixer></a-gltf-model>
        </a-entity>
      </a-entity>
    </a-scene>
  </div>

  <script type="module" src="./main.js"></script>
  
</body>
</html>
